<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Timer · OwlHacks '26</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="presets" role="group" aria-label="Timer length">
      <button type="button" class="preset" data-seconds="60">1 min</button>
      <button type="button" class="preset" data-seconds="120">2 min</button>
      <button type="button" class="preset" data-seconds="180">3 min</button>
      <button type="button" class="preset" data-seconds="300">5 min</button>
    </div>

    <div id="display" class="display" role="timer" aria-live="off">2:00</div>

    <div class="controls">
      <button type="button" id="toggle" class="control primary">Start</button>
      <button type="button" id="reset" class="control">Reset</button>
    </div>

    <p class="keys">Space: start or pause · R: reset · F: full screen</p>
  </main>

  <footer class="footer">
    Built live at OwlHacks by PhilaCon Valley ·
    <a id="community-link" href="https://discord.gg/fxUfeSbFZM">Join us on Discord →</a>
  </footer>

  <script src="timer.js"></script>
</body>
</html>
